<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="66天">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>66 天重置</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --text:#f1f5f9; --muted:#94a3b8; --accent:#22c55e; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family:-apple-system,"PingFang TC",sans-serif;
         padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 24px); }
  main { max-width:480px; margin:0 auto; }
  h1 { font-size:22px; margin:20px 0 4px; }
  .muted { color:var(--muted); font-size:14px; }
  .stats { display:flex; gap:12px; margin:16px 0; }
  .stat { flex:1; background:var(--card); border-radius:14px; padding:14px; text-align:center; }
  .stat b { display:block; font-size:28px; }
  .bar { height:8px; background:var(--card); border-radius:99px; overflow:hidden; }
  .bar > div { height:100%; background:var(--accent); transition:width .3s; }
  .item { display:flex; align-items:center; gap:12px; background:var(--card);
          border-radius:14px; padding:16px; margin-top:10px; font-size:17px; }
  .item.done span { text-decoration:line-through; color:var(--muted); }
  .check { width:28px; height:28px; border-radius:50%; border:2px solid var(--muted);
           background:none; color:#fff; font-size:16px; flex-shrink:0; padding:0; }
  .done .check { background:var(--accent); border-color:var(--accent); }
  .del { margin-left:auto; background:none; border:0; color:var(--muted); font-size:18px; }
  form { display:flex; gap:8px; margin-top:16px; }
  input { flex:1; min-width:0; padding:14px; border-radius:12px; border:0;
          background:var(--card); color:var(--text); font-size:16px; }
  button.primary { padding:14px 18px; border-radius:12px; border:0;
                   background:var(--accent); color:#052e16; font-weight:700; font-size:16px; }
  .link { background:none; border:0; color:var(--muted); text-decoration:underline;
          margin-top:28px; font-size:14px; }
  .banner { text-align:center; padding:20px; background:var(--card); border-radius:14px; margin-top:16px; }
</style>
</head>
<body>
<main id="app"></main>
<script>
const KEY = 'reset66:v1';
const TOTAL = 66;

// 日期一律用本地 YYYY-MM-DD 字串,避免時區與跨午夜問題
const pad = (n) => String(n).padStart(2, '0');
const fmt = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => fmt(new Date());
const dayDiff = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);

let state = load();

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.habits) return s;
  } catch (e) {}
  return { name: '66 天重置', startDate: today(), habits: [], checkins: {} };
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
}

const doneOn = (date) => state.checkins[date] || [];
const allDone = (date) =>
  state.habits.length > 0 && state.habits.every((h) => doneOn(date).includes(h.id));

// 連續天數:今天還沒全部完成時,從昨天往回算
function streak() {
  let d = parse(today());
  if (!allDone(fmt(d))) d.setDate(d.getDate() - 1);
  let n = 0;
  while (dayDiff(state.startDate, fmt(d)) >= 0 && allDone(fmt(d))) {
    n++;
    d.setDate(d.getDate() - 1);
  }
  return n;
}

function toggle(id) {
  const t = today();
  const list = new Set(doneOn(t));
  list.has(id) ? list.delete(id) : list.add(id);
  state.checkins[t] = [...list];
  save(); render();
}
function addHabit(name) {
  state.habits.push({ id: Date.now().toString(36), name });
  save(); render();
}
function removeHabit(id) {
  if (!confirm('刪除這個習慣?')) return;
  state.habits = state.habits.filter((h) => h.id !== id);
  save(); render();
}
function restart() {
  if (!confirm('重新開始 66 天?(習慣會保留,紀錄會清空)')) return;
  state.startDate = today();
  state.checkins = {};
  save(); render();
}

function render() {
  const day = Math.min(dayDiff(state.startDate, today()) + 1, TOTAL);
  const finished = dayDiff(state.startDate, today()) + 1 > TOTAL;
  const t = today();
  const done = doneOn(t).filter((id) => state.habits.some((h) => h.id === id)).length;

  const items = state.habits.map((h) => `
    <div class="item ${doneOn(t).includes(h.id) ? 'done' : ''}">
      <button class="check" data-toggle="${h.id}" aria-label="完成">✓</button>
      <span>${esc(h.name)}</span>
      <button class="del" data-del="${h.id}" aria-label="刪除">✕</button>
    </div>`).join('');

  document.getElementById('app').innerHTML = `
    <h1>${esc(state.name)}</h1>
    <div class="muted">第 ${day} / ${TOTAL} 天</div>
    <div class="bar" style="margin-top:10px"><div style="width:${(day / TOTAL) * 100}%"></div></div>
    <div class="stats">
      <div class="stat"><b>🔥 ${streak()}</b><span class="muted">連續天數</span></div>
      <div class="stat"><b>${done}/${state.habits.length}</b><span class="muted">今日完成</span></div>
    </div>
    ${finished ? '<div class="banner">🎉 66 天完成了!</div>' : ''}
    ${allDone(t) ? '<div class="banner">今天全部完成,做得好 👏</div>' : ''}
    ${items || '<p class="muted">還沒有習慣,先加一個吧。</p>'}
    <form id="add">
      <input id="name" placeholder="新增今天要做的事" maxlength="40" autocomplete="off">
      <button class="primary">新增</button>
    </form>
    <div style="text-align:center"><button class="link" id="restart">重新開始 66 天</button></div>`;

  document.getElementById('add').onsubmit = (e) => {
    e.preventDefault();
    const v = document.getElementById('name').value.trim();
    if (v) addHabit(v);
  };
  document.getElementById('restart').onclick = restart;
  document.querySelectorAll('[data-toggle]').forEach((b) => b.onclick = () => toggle(b.dataset.toggle));
  document.querySelectorAll('[data-del]').forEach((b) => b.onclick = () => removeHabit(b.dataset.del));
}

function esc(s) {
  return s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// 跨午夜或從背景切回來時重新整理
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });

render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
